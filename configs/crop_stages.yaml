# 阶段 7 / 7.3.1 —— 生育期配置（积温阈值）
#
# 只做三个作物：水稻、玉米、油菜（7.17 明确「47 个作物 —— 先水稻、玉米、油菜」）。
#
# 字段含义：
#   Tbase / Topt / Tu —— 下限 / 最适 / 上限温度，喂给 7.3.2 的积温四段式
#   stages[].gdd      —— **从播种算起**的累积有效积温阈值（不是阶段增量）
#   stages[].actions  —— 进入该阶段后的农事提示，被 7.4.1 的「积温跨阶段阈值」直接引用
#   nutrition         —— 推荐施肥量（kg/亩的**纯养分**，不是商品肥重量），
#                        供 src/farm/management.py 把施肥记录折算成对成熟日的影响。
#                        取值参照测土配方施肥的常规推荐量（水稻 N 10 左右、
#                        玉米 N 12 左右、大豆靠根瘤固氮所以 N 只要 4 上下），
#                        量级对，但不针对具体地块 —— 生产上仍应测土配方。
#   source            —— 阈值依据。清单要求写出来源，这里逐作物写明取法与出处口径。
#
# ---------------------------------------------------------------------------
# 【阈值是怎么定的 —— 请先读这段】
#
# 清单 7.3.1 给的示例（水稻 出苗100 / 分蘖600 / 拔节1200 / 成熟2000）是**结构示例**，
# 没有说明来源，也未经标定。而本平台的示例田要求「播种 30 天的水稻显示为分蘖期」，
# 用示例里的 600 会落到「出苗期」—— 演示看到的就不是分蘖期的样子了。
#
# 所以这里的阈值做了**标定**：用真实历史气温（Open-Meteo archive，武汉 30.58/114.30）
# 算出各作物在若干典型播期下的实际累积积温，再取文献常用的阶段累计比例落定。
# 标定用的是 scripts/25_warm_farm_cache.py 同一套取数逻辑，可复算：
#
#   2026-10-09 实测（武汉）：
#     水稻 播后 30 天 → 累积积温 400   （Tbase 10，日均温 23.3℃）
#     玉米 播后 70 天 → 累积积温 1072  （Tbase 10，日均温 27.1℃）
#     油菜 播后 200 天→ 累积积温 3808  （Tbase 5，日均温 25.2℃）
#
# 阶段的累计比例按农学通行的划分（各作物抽穗/开花大致落在全生育期的 50~60% 积温处）：
#   水稻：出苗 ~5% / 分蘖 ~17% / 拔节 ~43% / 抽穗 ~67% / 成熟 100%
#   玉米：出苗 ~5% / 苗期 ~15% / 拔节 ~35% / 抽穗 ~50% / 成熟 100%
#   油菜：出苗 ~6% / 苗期 ~28% / 蕾薹 ~56% / 开花 ~78% / 成熟 100%
#
# 这样做的好处是「进度」与「阶段」天然自洽（进度 = 积温 / 成熟阈值），
# 3D 视图按进度取参数时，分蘖期的水稻就会长成 20% 的样子、抽穗期的玉米约 54%。
# 阈值若要改，请连同这段注释一起改，别让文档和数字对不上。
#
# 【后加的四个作物 —— 口径不同于上面三个】
# 小麦 / 大豆 / 棉花 / 马铃薯 的阈值**没有**按武汉实测气温逐日标定，用的是文献通行的
# 阶段累计比例（全生育期按 5% / 20% / 45% / 68% / 100% 左右铺开）套同一个四段式。
# 它们足够支撑 3D 形态展示与「进度」语义，但**不是标定值**；若要用作生产建议，
# 请照上面的方法用真实气温重新标定，并把 source 字段一并更正。
# ---------------------------------------------------------------------------

水稻:
  source: "全国农业技术推广服务中心《水稻栽培技术规程》口径；阈值按武汉实测气温标定（见文件头）"
  Tbase: 10
  Topt: 30
  Tu: 42
  maturity_gdd: 2100          # 成熟期阈值，= stages 里最后一项的 gdd，单独写出来供进度计算
  nutrition: {n: 10, p2o5: 4, k2o: 6}   # kg/亩 纯养分
  stages:
    - {name: 出苗期, gdd: 100,  actions: [查苗补缺, 保持田面湿润]}
    - {name: 分蘖期, gdd: 350,  actions: [追分蘖肥, 保持浅水层]}
    - {name: 拔节期, gdd: 900,  actions: [晒田防倒伏, 控制氮肥]}
    - {name: 抽穗期, gdd: 1400, actions: [保水护穗, 注意稻飞虱与稻瘟病]}
    - {name: 成熟期, gdd: 2100, actions: [准备收割, 提前排水晒田]}

玉米:
  source: "《玉米栽培技术规程》口径；阈值按武汉实测气温标定（见文件头）"
  Tbase: 10
  Topt: 30
  Tu: 42
  maturity_gdd: 2000
  nutrition: {n: 12, p2o5: 5, k2o: 6}   # kg/亩 纯养分
  stages:
    - {name: 出苗期, gdd: 100,  actions: [查苗补缺, 破除板结]}
    - {name: 苗期,   gdd: 300,  actions: [定苗, 中耕除草]}
    - {name: 拔节期, gdd: 700,  actions: [追攻穗肥, 培土防倒伏]}
    - {name: 抽穗期, gdd: 1000, actions: [保证水分供应, 防治玉米螟]}
    - {name: 成熟期, gdd: 2000, actions: [苞叶变黄后适时收获]}

油菜:
  # 油菜是冷凉作物，最适温比水稻玉米低，四段式的折点必须跟着降 ——
  # 用 30/42 去算油菜会把夏天的日子算成大额积温，生育期整体提前一大截。
  source: "《油菜栽培技术规程》口径；阈值按武汉实测气温标定（见文件头）"
  Tbase: 5
  Topt: 25
  Tu: 35
  maturity_gdd: 1800
  nutrition: {n: 10, p2o5: 4, k2o: 6}   # kg/亩 纯养分
  stages:
    - {name: 出苗期, gdd: 100,  actions: [及时间苗, 防治蚜虫]}
    - {name: 苗期,   gdd: 500,  actions: [追苗肥, 中耕松土]}
    - {name: 蕾薹期, gdd: 1000, actions: [追薹肥, 注意菌核病]}
    - {name: 开花期, gdd: 1400, actions: [防倒伏, 避免花期喷药伤蜂]}
    - {name: 成熟期, gdd: 1800, actions: [角果变黄即收, 防止裂角落粒]}

小麦:
  # 冬春麦通用口径；累积阈值按文献比例铺开（见文件头「后加的四个作物」说明），非实测标定。
  source: "《小麦栽培技术规程》口径；累积阈值按文献阶段比例推算（未按武汉实测标定）"
  Tbase: 3
  Topt: 20
  Tu: 30
  maturity_gdd: 2200
  nutrition: {n: 11, p2o5: 5, k2o: 5}   # kg/亩 纯养分
  stages:
    - {name: 出苗期, gdd: 100,  actions: [查苗补种, 保墒防板结]}
    - {name: 分蘖期, gdd: 400,  actions: [追分蘖肥, 防冻保苗]}
    - {name: 拔节期, gdd: 1000, actions: [追拔节肥, 控旺防倒伏]}
    - {name: 抽穗期, gdd: 1500, actions: [保水, 防治赤霉病与蚜虫]}
    - {name: 成熟期, gdd: 2200, actions: [蜡熟末期及时收获]}

大豆:
  source: "《大豆栽培技术规程》口径；累积阈值按文献阶段比例推算（未按武汉实测标定）"
  Tbase: 10
  Topt: 30
  Tu: 40
  maturity_gdd: 2300
  nutrition: {n: 4, p2o5: 5, k2o: 5}    # kg/亩 纯养分；大豆根瘤固氮，氮只要别的一小半
  stages:
    - {name: 出苗期, gdd: 100,  actions: [查苗补缺, 破除板结]}
    - {name: 苗期,   gdd: 400,  actions: [定苗, 中耕除草]}
    - {name: 开花期, gdd: 1100, actions: [追花荚肥, 防治大豆蚜]}
    - {name: 结荚期, gdd: 1600, actions: [保水防旱, 防治食心虫]}
    - {name: 成熟期, gdd: 2300, actions: [叶片脱落后及时收获]}

棉花:
  source: "《棉花栽培技术规程》口径；累积阈值按文献阶段比例推算（未按武汉实测标定）"
  Tbase: 12
  Topt: 30
  Tu: 40
  maturity_gdd: 3000
  nutrition: {n: 12, p2o5: 5, k2o: 8}   # kg/亩 纯养分
  stages:
    - {name: 出苗期, gdd: 100,  actions: [查苗补缺, 中耕松土]}
    - {name: 苗期,   gdd: 500,  actions: [定苗, 促根控旺]}
    - {name: 蕾期,   gdd: 1200, actions: [追蕾肥, 及时整枝]}
    - {name: 花铃期, gdd: 2000, actions: [重施花铃肥, 防治红蜘蛛]}
    - {name: 吐絮期, gdd: 3000, actions: [及时采收, 防烂铃]}

马铃薯:
  source: "《马铃薯栽培技术规程》口径；累积阈值按文献阶段比例推算（未按武汉实测标定）"
  Tbase: 5
  Topt: 20
  Tu: 30
  maturity_gdd: 1700
  nutrition: {n: 10, p2o5: 5, k2o: 10}  # kg/亩 纯养分
  stages:
    - {name: 出苗期,   gdd: 100,  actions: [查苗补苗, 中耕松土]}
    - {name: 苗期,     gdd: 400,  actions: [追苗肥, 培土]}
    - {name: 块茎形成期, gdd: 900,  actions: [控水控氮, 防治晚疫病]}
    - {name: 块茎膨大期, gdd: 1300, actions: [保水, 增施钾肥]}
    - {name: 成熟期,   gdd: 1700, actions: [茎叶枯黄后及时收获]}

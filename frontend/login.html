<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 多方言 AI 农技与农田数字孪生平台</title>
<meta name="description" content="登录后可以使用「我的农田」：按积温推算生育期、3D 看长势、方言语音记账。">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body data-page="login">

<a class="visually-hidden" data-skip-link href="#main">跳到主要内容</a>

<header class="site-header">
  <div class="site-header__inner" data-layout-header></div>
</header>

<main id="main" class="page">

  <div class="auth-wrap">
    <div class="card auth-card">
      <h1 class="auth-card__title">登录</h1>
      <p class="auth-card__desc">登录后即可使用「我的农田」—— 积温看长势、3D 看田块、说方言记农事。</p>

      <form id="login-form" novalidate>
        <div class="form-field">
          <label class="form-label" for="login-username">用户名</label>
          <input class="input" id="login-username" name="username" autocomplete="username"
                 required maxlength="24" placeholder="英文字母、数字或下划线">
        </div>
        <div class="form-field">
          <label class="form-label" for="login-password">密码</label>
          <input class="input" id="login-password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>

        <p class="notice notice--danger" id="login-error" hidden></p>

        <button type="submit" class="btn btn--primary btn--block" id="login-submit">登录</button>
      </form>

      <p class="auth-card__foot">
        还没有账号？<a href="/register.html">立即注册</a>
      </p>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div data-layout-footer></div>
</footer>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/dialect.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
